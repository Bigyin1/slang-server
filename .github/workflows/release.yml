name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Update kind (major, minor, patch). Ignored when existing_tag is set.'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      existing_tag:
        description: 'Amend an existing release tag (e.g. v0.2.6) by re-running build + asset upload. Skips version bump and release creation.'
        required: false
        type: string
        default: ''
      artifact_run_id:
        description: 'Reuse artifacts from a successful Release dry run at the exact existing_tag commit instead of rebuilding.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build the selected ref and prepare release artifacts without publishing or pushing changes.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  validate-artifacts:
    if: inputs.artifact_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.existing_tag }}
          fetch-depth: 0
      - name: Verify artifact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.existing_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$RELEASE_TAG" == v* && "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          RELEASE_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > run.json
          jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .head_sha == $sha and .head_repository.full_name == $repo and
            .event == "workflow_dispatch" and .path == ".github/workflows/release.yml"
          ' run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" > artifacts.json
          jq -e '
            [.artifacts[] | select(.expired == false) | .name] as $names |
            ["slang-server-linux-x64", "slang-server-linux-arm64", "slang-server-macos",
             "slang-server-windows-x64", "slang-server-windows-arm64"] - $names | length == 0
          ' artifacts.json

  create-release:
    if: inputs.existing_tag == '' && inputs.artifact_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      version: ${{ steps.bump_version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump_version
        run: |
          # Read current version
          CURRENT_VERSION=$(cat VERSION)
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump based on kind
          case "${{ github.event.inputs.kind }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update versions
        run: |
          VERSION="${{ steps.bump_version.outputs.version }}"
          echo "$VERSION" > VERSION
          CLIENT_VERSION="${VERSION%.*}"
          sed -i "s/^M\\.CLIENT_VERSION = .*/M.CLIENT_VERSION = \"$CLIENT_VERSION\"/" clients/neovim/lua/slang-server/_lsp/capabilities.lua
          echo "Updated VERSION to: $VERSION"
          cat VERSION
          echo "Updated Neovim client version to: $CLIENT_VERSION"

      - name: Commit version update
        if: inputs.dry_run == false
        run: |
          VERSION="${{ steps.bump_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION clients/neovim/lua/slang-server/_lsp/capabilities.lua
          git commit -m "Update VERSION to $VERSION"
          git push origin main
          echo "Committed VERSION update to main"

      - name: Create and push tag
        id: create_tag
        if: inputs.dry_run == false
        run: |
          VERSION="${{ steps.bump_version.outputs.version }}"
          TAG_NAME="v$VERSION"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created and pushed tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        if: inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.create_tag.outputs.tag_name }}"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --draft=false \
            --prerelease=false
          echo "Created GitHub release: $TAG_NAME"

  build:
    needs: create-release
    if: always() && inputs.artifact_run_id == '' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    uses: ./.github/workflows/build.yml
    with:
      upload_artifacts: true
      # If amending, build from the existing tag so binaries match the release.
      # Dry runs build the ref selected when dispatching the workflow. Otherwise,
      # build from main, which now has the bumped VERSION committed.
      ref: ${{ inputs.existing_tag || (inputs.dry_run && github.ref) || 'main' }}

  add-release-assets:
    needs: [create-release, build, validate-artifacts]
    if: always() && (needs.build.result == 'success' || needs.validate-artifacts.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release assets
        id: prepare
        run: |
          mkdir -p release-assets
          if [ -d artifacts ]; then
            find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \; 2>/dev/null || true
          fi
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "Warning: No release artifacts found"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            ls -lh release-assets/
          fi

      - name: Upload assets to release
        if: steps.prepare.outputs.has_artifacts == 'true' && inputs.dry_run == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.existing_tag || needs.create-release.outputs.tag_name }}"
          gh release upload "$TAG_NAME" release-assets/* --clobber

  publish-vscode:
    needs: [create-release, add-release-assets]
    if: needs.create-release.result == 'success' && needs.add-release-assets.result == 'success' && inputs.kind != 'patch' && inputs.dry_run == false
    uses: ./.github/workflows/vscode-publish.yml
    with:
      kind: ${{ inputs.kind }}
      prerelease: false
    secrets: inherit

  publish-neovim:
    needs: [create-release, add-release-assets]
    if: needs.create-release.result == 'success' && needs.add-release-assets.result == 'success' && inputs.kind != 'patch' && inputs.dry_run == false
    uses: ./.github/workflows/neovim-sync.yml
    with:
      ref: main
      sync_event: push
    secrets: inherit
